name: Windows portable

on:
  pull_request:
  push:
    branches:
      - main
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  windows-portable:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Installs (and caches) every tool pinned in mise.toml, Node and yarn
      # included, and puts them ahead of the runner's own on PATH.
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3

      - name: Read the Node version mise installed
        id: node
        run: echo "version=$(node -p process.versions.node)" >> "$GITHUB_OUTPUT"

      - name: Resolve yarn cache folder
        id: yarn-config
        run: echo "cacheFolder=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

      - name: Restore yarn install cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            node_modules
            ${{ steps.yarn-config.outputs.cacheFolder }}
            .yarn/install-state.gz
          key:
            yarn-${{ runner.os }}-node${{ steps.node.outputs.version }}-${{ hashFiles('yarn.lock')
            }}
          restore-keys: |
            yarn-${{ runner.os }}-node${{ steps.node.outputs.version }}-

      - name: Install deps
        env:
          YARN_ENABLE_HARDENED_MODE: "false"
        run: |
          case "$(yarn --version)" in 1.*) echo 'expected up-to-date yarn version'; exit 1 ;; esac
          yarn install --immutable

      - name: Build static export
        run: yarn build

      - name: Build DOSGamesPortable.exe
        run: yarn electron-builder --win portable --x64 --publish never

      - name: Lay out a stick (exe with bin/DOSBoxPortable beside it)
        run: |
          mkdir -p stick/bin
          cp dist/DOSGamesPortable.exe stick/
          cp -r bin/DOSBoxPortable stick/bin/

      - name: Smoke test the portable exe
        env:
          E2E_ARTIFACTS: ${{ runner.temp }}/e2e
        run: node scripts/e2e/verify.mjs --portable-exe stick/DOSGamesPortable.exe

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-portable-screenshots
          path: ${{ runner.temp }}/e2e
          if-no-files-found: warn

      - name: Upload DOSGamesPortable.exe
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: DOSGamesPortable
          path: dist/DOSGamesPortable.exe
          if-no-files-found: error

  attach-to-release:
    if: github.event_name == 'release'
    needs: windows-portable
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: DOSGamesPortable

      - name: Attach DOSGamesPortable.exe to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run:
          gh release upload "${{ github.event.release.tag_name }}" DOSGamesPortable.exe --clobber
          --repo "${{ github.repository }}"

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b1d8f"/>
      <stop offset="1" stop-color="#0f0a2e"/>
    </linearGradient>
    <linearGradient id="disk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f3b52"/>
      <stop offset="1" stop-color="#1a2234"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="48" fill="url(#sky)"/>
  <g shape-rendering="crispEdges">
    <!-- floppy body with a clipped corner -->
    <path d="M44 40 H196 L216 60 V216 H44 Z" fill="url(#disk)" stroke="#0b0f1a" stroke-width="6"/>
    <!-- metal shutter -->
    <rect x="80" y="40" width="96" height="60" fill="#c9d2de"/>
    <rect x="148" y="50" width="18" height="40" fill="#2f3b52"/>
    <!-- label -->
    <rect x="64" y="120" width="132" height="84" fill="#fff4d6"/>
    <rect x="64" y="120" width="132" height="12" fill="#ff5d73"/>
  </g>
  <!-- play triangle -->
  <path d="M112 142 L156 166 L112 190 Z" fill="#22c55e" stroke="#0b0f1a" stroke-width="5" stroke-linejoin="round"/>
</svg>
